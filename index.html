<!doctype html>
<html lang="es" data-nz-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Metro de Madrid · la red en su sitio</title>
<meta name="description" content="Red del Metro de Madrid con la geometría real del CRTM y las estaciones modeladas en 3D colocadas en su sitio.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Ntizar/Aurora@v10/tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Ntizar/Aurora@v10/packs/all.css">
<link rel="stylesheet" href="css/mapa.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body class="nz">

<canvas id="lienzo" aria-label="Red del Metro de Madrid en 3D"></canvas>

<header class="cab">
  <p class="nz-lbl">Madrid subterráneo</p>
  <h1>La red, en su sitio</h1>
  <p class="nz-text--muted nz-text--small" id="sub">Geometría real del CRTM · 240 estaciones · 13 líneas · 12 estaciones modeladas en 3D</p>
</header>

<aside class="leyenda" id="leyenda" aria-label="Líneas"></aside>

<footer class="pie">
  <span id="ayuda" class="nz-text--small nz-text--muted">Arrastra para girar · rueda para acercar · pulsa una estación con modelo para verla en corte</span>
  <span class="nz-lbl">Hecho con ❤️ por David Antizar</span>
</footer>

<div class="tarjeta" id="tarjeta" hidden>
  <p class="nz-lbl" id="tarjeta-lbl">Estación</p>
  <p class="tarjeta__nombre" id="tarjeta-nombre"></p>
  <p class="nz-text--small nz-text--muted" id="tarjeta-lineas"></p>
  <a class="tarjeta__btn" id="tarjeta-ir" href="#">Ver en corte →</a>
</div>

<script type="module" src="mapa.js"></script>
</body>
</html>
